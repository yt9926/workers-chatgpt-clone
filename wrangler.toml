# 静的ファイル（チャットUI）を配信するアセット設定
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI バインディング
[ai]
binding = "AI"

# D1 データベースバインディング
[[d1_databases]]
binding = "DB"
database_name = "workers-chatgpt-clone-db"
database_id = "23d85c03-577d-4f62-8bcd-d46d5a9e276d"

