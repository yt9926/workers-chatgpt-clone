<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workers Chat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bubble-user: #10a37f;
    --bubble-user-fg: #ffffff;
    --bubble-assistant: #f3f4f6;
    --bubble-assistant-fg: #1a1a1a;
    --accent: #10a37f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --fg: #ececec;
      --muted: #9ca3af;
      --border: #3a3a3a;
      --bubble-assistant: #2f2f2f;
      --bubble-assistant-fg: #ececec;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 860px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #newChatBtn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  #newChatBtn:hover { background: var(--bubble-assistant); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    max-width: 320px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-fg);
    border-bottom-left-radius: 4px;
  }
  .bubble.typing { display: flex; gap: 4px; align-items: center; padding: 14px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14.5px;
    background: var(--bg);
    color: var(--fg);
    max-height: 160px;
    font-family: inherit;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #sendBtn {
    border: none;
    background: var(--accent);
    color: #fff;
    width: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-banner {
    margin: 8px 16px 0;
    padding: 8px 12px;
    border-radius: 8px;
    background: #fee2e2;
    color: #991b1b;
    font-size: 13px;
  }
</style>
</head>

<body>
<div id="app">
  <header>
    <div>
      <h1>Workers Chat</h1>
      <div class="sub">Cloudflare Workers AI + D1</div>
    </div>
    <button id="newChatBtn" type="button">新しい会話</button>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="メッセージを入力..." autofocus></textarea>
    <button id="sendBtn" type="submit">↑</button>
  </form>
</div>

<script>
(function () {
  const SESSION_KEY = "workers_chat_session_id";
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const newChatBtn = document.getElementById("newChatBtn");

  function getSessionId() {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = crypto.randomUUID().replace(/-/g, "");
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  }

  let sessionId = getSessionId();

  function renderEmptyState() {
    messagesEl.innerHTML = '<div class="empty-state">こんにちは！何でも聞いてください。会話の履歴はこのブラウザに保存されます。</div>';
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, content) {
    const empty = messagesEl.querySelector(".empty-state");
    if (empty) empty.remove();

    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function appendTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.id = "typingRow";
    row.innerHTML = '<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  function showError(message) {
    const banner = document.createElement("div");
    banner.className = "error-banner";
    banner.textContent = message;
    form.parentElement.insertBefore(banner, form);
    setTimeout(() => banner.remove(), 5000);
  }

  async function loadHistory() {
    try {
      const res = await fetch("/api/history?session_id=" + encodeURIComponent(sessionId));
      if (!res.ok) throw new Error("failed to load history");
      const data = await res.json();
      if (data.messages && data.messages.length > 0) {
        for (const m of data.messages) {
          appendMessage(m.role, m.content);
        }
      } else {
        renderEmptyState();
      }
    } catch (e) {
      renderEmptyState();
    }
  }

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoResize);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    autoResize();
    appendMessage("user", text);
    sendBtn.disabled = true;
    appendTypingIndicator();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        showError(data.error || "エラーが発生しました");
      } else {
        appendMessage("assistant", data.reply);
      }
    } catch (err) {
      removeTypingIndicator();
      showError("通信エラーが発生しました。もう一度お試しください。");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  newChatBtn.addEventListener("click", async () => {
    if (!confirm("このブラウザの会話履歴を削除して新しい会話を始めますか？")) return;
    try {
      await fetch("/api/history?session_id=" + encodeURIComponent(sessionId), { method: "DELETE" });
    } catch (e) {
      // ignore
    }
    messagesEl.innerHTML = "";
    renderEmptyState();
  });

  loadHistory();
})();
</script>
</body>
</html>
